_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: "__APP_DISPLAY_NAME__"
  description: Slack assistant backed by Amazon Bedrock AgentCore Harness
  background_color: "#232f3e"

features:
  bot_user:
    display_name: "__APP_DISPLAY_NAME__"
    always_online: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history

settings:
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
